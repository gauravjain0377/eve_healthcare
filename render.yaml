services:
  - type: web
    name: eve-healthcare-api
    runtime: python
    buildCommand: pip install -r requirements.txt && python seed_data.py
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: ENVIRONMENT
        value: production
      - key: DEBUG
        value: false
      - key: SECRET_KEY
        generateValue: true
      - key: WEBHOOK_SECRET
        value: whsec_simulated_eve_secret_key_8921
      - key: CACHE_ENABLED
        value: false
