version: '3.8'

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: eve_healthcare_api
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - ENVIRONMENT=production
      - DEBUG=False
      - SECRET_KEY=eve_prod_secret_key_change_me_93817402847291
      - DATABASE_URL=postgresql://eve_user:eve_password@postgres:5432/eve_db
      - REDIS_URL=redis://redis:6379/0
      - CACHE_ENABLED=True
      - WEBHOOK_SECRET=whsec_eve_healthcare_simulated_key
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - eve_network

  postgres:
    image: postgres:16-alpine
    container_name: eve_healthcare_postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_USER=eve_user
      - POSTGRES_PASSWORD=eve_password
      - POSTGRES_DB=eve_db
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U eve_user -d eve_db"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - eve_network

  redis:
    image: redis:7-alpine
    container_name: eve_healthcare_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - eve_network

networks:
  eve_network:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
